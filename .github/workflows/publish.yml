name: Publish to NuGet

# Manual only: run from the Actions tab after bumping <Version> in the csproj files.
# Every package under src/ whose version is not yet on NuGet.org is packed and pushed;
# packages whose version already exists are skipped.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and list the packages without pushing them'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Packing runs third-party code (restore, MSBuild targets of packages): it gets no secrets and no write access
  pack:
    name: Pack
    needs: ci
    # Publish only from master; a dry run may come from any branch
    if: ${{ github.ref == 'refs/heads/master' || inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack packages with new versions
        run: |
          set -euo pipefail
          mkdir -p nupkgs
          : > nupkgs/published.txt

          for project in src/*/*.csproj; do
            package_id=$(dotnet msbuild "$project" -getProperty:PackageId)
            version=$(dotnet msbuild "$project" -getProperty:Version)
            lower_id=$(echo "$package_id" | tr '[:upper:]' '[:lower:]')

            status=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.nuget.org/v3-flatcontainer/$lower_id/$version/$lower_id.$version.nupkg")

            if [ "$status" = "200" ]; then
              echo "⏭️  $package_id $version already on NuGet.org, skipping"
              continue
            fi

            echo "📦 Packing $package_id $version"
            dotnet pack "$project" --configuration Release --output ./nupkgs
            echo "$package_id $version" >> nupkgs/published.txt
          done

          echo "Packages to publish:"
          cat nupkgs/published.txt

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: nupkgs/
          if-no-files-found: error
          retention-days: 7

  # Pushing gets a short-lived NuGet key through Trusted Publishing (OIDC) in the protected environment; it runs no
  # code from the repository or its packages (no checkout, no restore)
  push:
    name: Push to NuGet.org
    needs: pack
    if: ${{ github.ref == 'refs/heads/master' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: nupkgs

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for package in ./nupkgs/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  release:
    name: Create GitHub release
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: nupkgs

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -s nupkgs/published.txt ]; then
            echo "Nothing was published; no release created."
            exit 0
          fi

          # The tag is the version of ToonNet.Core, or of the first package published without it
          version=$(awk '$1 == "ToonNet.Core" { print $2 }' nupkgs/published.txt)
          if [ -z "$version" ]; then
            version=$(awk 'NR == 1 { print $2 }' nupkgs/published.txt)
          fi
          tag="v$version"

          # An existing release keeps its assets: packages built from another commit are not attached to its tag
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::warning::Release $tag already exists; the new packages are on NuGet.org but not attached to it."
            exit 0
          fi

          {
            echo "## Published packages"
            echo
            sed 's/^/- /' nupkgs/published.txt
          } > release-notes.md

          gh release create "$tag" nupkgs/*.nupkg \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release-notes.md \
            --generate-notes
